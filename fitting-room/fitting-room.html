<title>Fitting Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: a phone-first fitting-room rail. Sticky wordmark header, swing-tag item tiles on a plaster ground, a bottom tab bar; widens to a 3-5 column rail on desktop. */
  --bg:#F1EBED; --surface:#FFFAFB; --surface-2:#F7F1F3; --tile:#E8DFE3; --ink:#221A23; --muted:#6F626D; --line:#DCD0D6;
  --plum:#4A2147; --plum-2:#6D3A68; --on-plum:#FFF5FA;
  --saffron:#D99A10; --saffron-soft:#F7E6BC; --saffron-ink:#2B1D00;
  --good:#2C7A56; --warn:#9C6410; --bad:#AE2F28; --scrim:rgba(30,16,28,.5);
  --mq:#DAD1D6; --mq-line:#B4A7AF;
  --shadow:0 1px 2px rgba(50,20,45,.06),0 10px 30px rgba(50,20,45,.10);
  --f-display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-s:9px; --r-m:14px; --r-l:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151016; --surface:#1F1820; --surface-2:#251D27; --tile:#2D242F; --ink:#F4ECF2; --muted:#B2A4AF; --line:#3A2F3C;
    --plum:#E3B4DB; --plum-2:#C98FC0; --on-plum:#2A1127;
    --saffron:#F0B53A; --saffron-soft:#3A2D12; --saffron-ink:#2B1D00;
    --good:#6CCB9C; --warn:#E8B15A; --bad:#F08A82; --scrim:rgba(0,0,0,.62);
    --mq:#5E525D; --mq-line:#7B6E79;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151016; --surface:#1F1820; --surface-2:#251D27; --tile:#2D242F; --ink:#F4ECF2; --muted:#B2A4AF; --line:#3A2F3C;
  --plum:#E3B4DB; --plum-2:#C98FC0; --on-plum:#2A1127;
  --saffron:#F0B53A; --saffron-soft:#3A2D12; --saffron-ink:#2B1D00;
  --good:#6CCB9C; --warn:#E8B15A; --bad:#F08A82; --scrim:rgba(0,0,0,.62);
  --mq:#5E525D; --mq-line:#7B6E79;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.shell{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(104px + env(safe-area-inset-bottom,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.mark{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.01em;text-decoration:none;line-height:1}
.mark em{font-style:italic;font-weight:500;color:var(--plum)}
.qpill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:500 11.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 11px;text-decoration:none}
.qpill i{width:7px;height:7px;border-radius:50%;background:var(--saffron);animation:pulse 1.2s ease-in-out infinite}
.me-btn{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.qpill + .me-btn{margin-left:0}
.me-btn svg{width:22px;height:22px}
@keyframes pulse{50%{opacity:.25}}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11.5px;font-weight:500;color:var(--muted);text-decoration:none;border-radius:12px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--plum)}
.tab[aria-current="page"] svg{stroke-width:2}
.badge{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--saffron);color:var(--saffron-ink);font:600 10.5px/18px var(--f-mono);padding:0 5px;text-align:center}
.badge.pulse{animation:pulse 1.2s ease-in-out infinite}

/* type */
.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.vhead{display:flex;flex-direction:column;gap:6px}
.vhead h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,7vw,40px);line-height:1.02;letter-spacing:-.015em}
.vhead h1 em{font-style:italic;font-weight:500;color:var(--plum)}
.sub{color:var(--muted);max-width:62ch}
.eyebrow{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1;display:flex;align-items:baseline;gap:8px}
h2.sec small{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border:1px solid var(--plum);background:var(--plum);color:var(--on-plum);border-radius:99px;padding:10px 18px;font-weight:600;font-size:14.5px;text-decoration:none;min-height:42px}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent;color:var(--plum)}
.btn.soft{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.btn.warn{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip b{font:500 11px var(--f-mono);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px}
.search input{border:0;background:none;flex:1;min-width:0;outline:none;font-size:15px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font:500 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;min-height:42px;width:100%;min-width:0}
.fld textarea{min-height:88px;resize:vertical;line-height:1.4}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.range{display:flex;flex-direction:column;gap:6px}
.range input{width:100%;accent-color:var(--plum)}
.range .ends{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.range .val{font-weight:600}
select.plain{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13.5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* notices */
.note{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note p{flex:1;min-width:200px}
.note.hi{background:var(--saffron-soft);border-color:transparent}
.note.bad{border-color:var(--bad)}

/* closet grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:7px 7px 10px;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0;position:relative}
.tile:hover{border-color:var(--muted)}
.tile-pic{aspect-ratio:4/5;max-width:100%;background:var(--tile);border-radius:10px;overflow:hidden;position:relative;display:grid;place-items:center}
.tile-pic > img{width:100%;height:100%;object-fit:contain;display:block}
.tile-pic > svg{width:80%;height:80%}
.tile-name{font-weight:600;font-size:14px;line-height:1.25;padding-inline:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tagline{font:500 10px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-inline:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.flag{position:absolute;top:7px;left:7px;font:600 9.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--surface);color:var(--muted)}
.flag.rev{background:var(--saffron);color:var(--saffron-ink)}
.hole{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-l);padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{font-family:var(--f-display);font-size:22px;font-weight:600}
.toolbar{display:flex;flex-direction:column;gap:10px}
.toolbar .row{justify-content:space-between}

/* add */
.capture{background:var(--plum);color:var(--on-plum);border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.capture h2{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.05}
.capture p{opacity:.85;max-width:52ch}
.cap-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--on-plum);color:var(--plum);border-radius:16px;padding:14px;font-weight:600;cursor:pointer;position:relative;min-height:92px}
.cap-btn.alt{background:transparent;color:var(--on-plum);border:1.5px solid color-mix(in srgb,var(--on-plum) 45%,transparent)}
.cap-btn svg{width:28px;height:28px}
.cap-btn small{font-weight:400;opacity:.75;font-size:12.5px}
.cap-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cap-btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;font-size:13.5px;opacity:.9;padding:0;margin:0;list-style:none}
.tips li{display:flex;gap:8px}
.tips li::before{content:"";flex:none;width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--saffron)}
.progress{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--tile);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--plum);border-radius:99px;transition:width .3s}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ph{flex:none;width:64px;height:80px;border-radius:10px;overflow:hidden;position:relative;background:var(--tile);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph b{position:absolute;inset:auto 0 0 0;font:600 9px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:4px 2px;background:var(--surface);color:var(--muted)}
.ph.reading b{background:var(--saffron);color:var(--saffron-ink)}
.ph.failed b{background:var(--bad);color:#fff}
.ph.done b{background:var(--good);color:#fff}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:grid;grid-template-columns:120px 1fr;gap:14px}
.review .pics{display:flex;flex-direction:column;gap:8px}
.review .pic{aspect-ratio:4/5;background:var(--tile);border-radius:12px;overflow:hidden;display:grid;place-items:center;max-width:100%}
.review .pic img{width:100%;height:100%;object-fit:contain}
.review .pic svg{width:80%;height:80%}
.review .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.ask{background:var(--saffron-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask q{quotes:none;font-weight:600}
.dupe{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px}
.dupe .pic{width:56px;flex:none}
.dupe p{flex:1;min-width:0;font-size:13.5px}
details.manual{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
details.manual summary{cursor:pointer;font-weight:600}
details.manual[open] summary{margin-bottom:12px}

/* looks */
.look{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:grid;grid-template-columns:minmax(118px,36%) 1fr;gap:16px;min-width:0}
.doll-box{background:var(--tile);border-radius:16px;display:grid;place-items:center;padding:8px 4px;max-width:100%;position:relative}
.doll-box svg.doll{width:100%;height:auto;max-height:420px}
.doll-box.big svg.doll{max-height:520px}
.look-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.look-more{grid-column:1 / -1;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:700px){.look{grid-template-rows:auto 1fr}.look > .doll-box{grid-row:1 / span 2}.look-more{grid-column:2}}
.look-name{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.05}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{width:52px;height:62px;border-radius:9px;background:var(--tile);border:1px solid var(--line);padding:0;overflow:hidden;display:grid;place-items:center;flex:none}
.mini img{width:100%;height:100%;object-fit:contain}
.mini svg{width:82%;height:82%}
.tip{font-size:14px;color:var(--muted)}
.tip b{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--plum);margin-right:6px}
.missing{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.miss{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.miss-pic{width:44px;height:52px;border-radius:8px;border:1.5px dashed var(--saffron);display:grid;place-items:center;background:var(--surface-2)}
.miss-pic svg{width:80%;height:80%}
.miss span{display:flex;flex-direction:column;min-width:0}
.miss small{color:var(--muted);font-size:12.5px;line-height:1.3}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:12px}
.brief textarea{width:100%;border:0;background:none;resize:none;font-family:var(--f-display);font-size:21px;line-height:1.25;min-height:64px;outline:none}
.brief textarea::placeholder{color:var(--muted);font-style:italic}
.anchor{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:6px 10px 6px 6px}
.anchor .mini{width:40px;height:48px}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted)}
.hanger-anim{width:34px;height:34px;color:var(--plum);animation:sway 1.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.lookbook{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:8px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.lb .doll-box{padding:6px 0}
.lb .doll-box svg.doll{max-height:230px}
.lb h3{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.1;padding-inline:3px}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;padding:0}
.heart svg{width:16px;height:16px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:8px;display:flex;flex-direction:column;gap:6px}
.pair .two{display:flex;gap:6px}
.pair .two .mini{width:auto;flex:1;height:72px}

/* identity + completeness */
.flag.use{top:auto;bottom:7px;background:var(--plum);color:var(--on-plum)}
.what{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--plum);color:var(--on-plum);white-space:nowrap}
.pill.soft{background:var(--tile);color:var(--ink)}
.complete{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.complete svg{width:18px;height:18px;flex:none;margin-top:1px}
.complete.ok{background:color-mix(in srgb,var(--good) 15%,transparent)}
.complete.ok svg{color:var(--good)}
.complete.need{background:var(--saffron-soft)}
.complete.need svg{color:var(--warn)}
.miss-pic.need{border-color:var(--bad);border-style:solid}
.mgroup{display:flex;flex-direction:column;gap:8px}

/* inspiration */
.inspo-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inspo-ph{position:relative;width:76px;height:96px;border-radius:12px;overflow:hidden;background:var(--tile);border:1px solid var(--line);flex:none}
.inspo-ph img{width:100%;height:100%;object-fit:cover;display:block}
.inspo-ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;padding:0}
.inspo-ph button svg{width:14px;height:14px}
.add-ph{width:76px;height:96px;border-radius:12px;border:1.5px dashed var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;color:var(--muted);flex:none;font-size:12px;font-weight:500;cursor:pointer}
.add-ph svg{width:24px;height:24px}
.add-ph input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.add-ph[aria-disabled="true"]{opacity:.45;pointer-events:none}

const chains = new Map();
function chain(path, fn) { const prev = chains.get(path) || Promise.resolve(); const next = prev.catch(() => {}).then(fn); chains.set(path, next); next.finally(() => { if (chains.get(path) === next) chains.delete(path); }).catch(() => {}); return next; }
async function w(path, kind, data) {

  try {
    await chain(path, () => kind === 'set' ? S.db.doc(path).set(clean(data)) : kind === 'update' ? S.db.doc(path).update(clean(data)) : S.db.doc(path).delete());

}

async function init() {

  const get = n => Promise.resolve().then(() => c.use(n)).catch(() => null);
  const [db, assets, sample, downloads, user] = await Promise.all(['db', 'assets', 'sample', 'downloads', 'user'].map(get));
  Object.assign(S, {db, assets, sample, downloads, user});
  if (user) { try { S.isOwner = await user.isOwner(); } catch {} }
  if (sample && typeof sample.limits === 'function') { try { const l = await sample.limits(); S.imagesOK = !!(l && l.images); S.maxImages = (l && l.images && l.images.maxCount) || 1; } catch {} }

function subscribe() {
  const timer = setTimeout(() => { if (!S.confirmed) { S.slow = true; emit(); } }, 10000);
  const seen = snap => { if (snap && snap.metadata && !snap.metadata.fromCache && !S.confirmed) { S.confirmed = true; S.slow = false; clearTimeout(timer); } };
  for (const name of ['items', 'outfits', 'wears', 'photos', 'wishlist', 'inspiration']) {
    S.db.collection(name).onSnapshot(snap => {
      S[name] = snap.docs.map(d => ({id: d.id, ...d.data()}));
      S.loaded[name] = true; seen(snap);
      if (name === 'photos') pump();
      emit();
    }, err => { S.loaded[name] = true; S.dbError = (err && err.code) || 'unavailable'; clearTimeout(timer); S.slow = false; emit(); });
  }
  S.db.doc('prefs/profile').onSnapshot(snap => {
    S.profile = {...DEFAULT_PROFILE, ...(snap.exists ? snap.data() : {})}; S.loaded.profile = true; seen(snap); emit();
  }, () => { S.loaded.profile = true; emit(); });
}

async function decodeImage(blob) {
  if (typeof createImageBitmap === 'function') {
    try { return await createImageBitmap(blob, {imageOrientation: 'from-image'}); } catch {}
    try { return await createImageBitmap(blob); } catch {}
  }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(blob); const im = new Image(); im.onload = () => res(im); im.onerror = () => { URL.revokeObjectURL(u); rej({code: 'decode'}); }; im.src = u; });
}
const dimsOf = im => [im.naturalWidth || im.width, im.naturalHeight || im.height];
async function toJpeg(im, sx, sy, sw, sh, maxDim, q) {
  const k = Math.min(1, maxDim / Math.max(sw, sh)); const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q || 0.86));
  if (!blob) throw {code: 'decode'};
  return {blob, w, h};
}
async function prepPhoto(file, withThumb) {
  const im = await decodeImage(file); const [W, H] = dimsOf(im);
  const out = await toJpeg(im, 0, 0, W, H, 1600, 0.86);
  if (withThumb) { try { const t = await toJpeg(im, 0, 0, W, H, 200, 0.72); out.thumb = URL.createObjectURL(t.blob); } catch {} }
  if (im.close) im.close();
  return out;
}
let wakeLock = null;
async function syncWake() {
  const active = S.inflight.size > 0 || S.session.some(id => ['preparing', 'uploading'].includes((S.local[id] || {}).state));
  try {
    if (active && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!active && wakeLock) { const l = wakeLock; wakeLock = null; await l.release(); }
  } catch { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncWake(); });
function normBox(b) {
  if (!Array.isArray(b) || b.length !== 4) return null;
  let [x0, y0, x1, y1] = b.map(v => num(v, NaN));
  if (![x0, y0, x1, y1].every(Number.isFinite)) return null;
  const scale = Math.max(x0, y0, x1, y1) <= 1.001 ? 1 : 1000;
  [x0, y0, x1, y1] = [x0, y0, x1, y1].map(v => clamp(v / scale, 0, 1));
  if (x1 < x0) [x0, x1] = [x1, x0]; if (y1 < y0) [y0, y1] = [y1, y0];
  if ((x1 - x0) < 0.04 || (y1 - y0) < 0.04) return null;
  return [x0, y0, x1, y1];
}

const blobCache = new Map();
const setLocal = (id, patch) => { S.local[id] = {...(S.local[id] || {}), ...patch}; emit(); };
async function addPhotos(fileList) {
  const files = Array.from(fileList || []).filter(f => f && ((f.type || '').startsWith('image/') || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name || '')));
  if (!files.length) return;
  if (!canAdd()) { toast(S.isOwner === false ? 'Only the wardrobe’s owner can add pieces.' : 'Adding photos isn’t available in this view.'); return; }
  S.armed = true;
  syncWake();
  const jobs = files.map(f => { const id = uid('ph'); S.local[id] = {state: 'preparing', preview: ''}; S.session.unshift(id); return [id, f]; });
  emit();
  for (const [id, f] of jobs) {
    try {
      const {blob, w: W, h: H, thumb} = await prepPhoto(f, true);
      setLocal(id, {state: 'uploading', preview: thumb || ''});
      const up = await S.assets.upload(blob, {type: 'image/jpeg'});
      blobCache.set(id, blob);
      const ok = await w('photos/' + id, 'set', {sourceId: up.id, w: W, h: H, status: 'queued', addedAt: Date.now()});
      setLocal(id, {state: ok ? 'waiting' : 'failed', err: ok ? '' : 'Couldn’t save this photo.'});
    } catch (e) {
      const c = e && e.code;
      setLocal(id, {state: 'failed', err: c === 'decode' ? 'This photo format can’t be opened here. Try a JPEG or PNG.' : c === 'too_large' ? 'This photo is too large.' : c === 'quota_or_state' ? 'Photo storage is full.' : 'This photo couldn’t be uploaded.'});
    }
  }
  pump(); syncWake();
}
function pump() {
  if (!S.armed || S.paused || S.aiOff || !S.sample || !S.imagesOK) return;
  const queued = S.photos.filter(p => p.status === 'queued' && !S.inflight.has(p.id)).sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
  while (S.inflight.size < 2 && queued.length) {
    const p = queued.shift(); S.inflight.add(p.id); emit();
    processPhoto(p).catch(() => {}).finally(() => { S.inflight.delete(p.id); emit(); setTimeout(pump, 0); });
  }
  syncWake();
}

async function processPhoto(p) {
  setLocal(p.id, {state: 'reading'});
  try {
    let blob = blobCache.get(p.id);
    if (!blob) { const r = await fetch(imgUrl(p.sourceId)); if (!r.ok) throw {code: 'missing_photo'}; blob = await r.blob(); }

    const raw = arr(res && res.items).slice(0, 12);
    let im = null, W = 0, H = 0;
    if (raw.length) { try { im = await decodeImage(blob); [W, H] = dimsOf(im); } catch {} }
    const ids = [];
    for (const r of raw) {
      if (!r || typeof r !== 'object') continue;
      const it = normItem(r);
      const box = normBox(r.bbox);
      let imageId = p.sourceId;
      if (im && box && (box[2] - box[0]) * (box[3] - box[1]) < 0.86) {
        try {
          const bw = (box[2] - box[0]) * W, bh = (box[3] - box[1]) * H, pad = Math.max(bw, bh) * 0.05;
          const sx = clamp(box[0] * W - pad, 0, W), sy = clamp(box[1] * H - pad, 0, H);
          const ex = clamp(box[2] * W + pad, 0, W), ey = clamp(box[3] * H + pad, 0, H);
          const {blob: cb} = await toJpeg(im, sx, sy, ex - sx, ey - sy, 900, 0.88);
          const up = await S.assets.upload(cb, {type: 'image/jpeg'});
          imageId = up.id;
        } catch {}
      }
      const dupId = str(r.duplicateOf);

    </div>

function PhotoStrip() {
  const ids = S.session.slice(0, 40);
  if (!ids.length) return null;
  const lab = {preparing: 'Prep', uploading: 'Saving', waiting: 'Queued', reading: 'Reading', done: 'Added', empty: 'Nothing', failed: 'Failed'};
  return html`<div class="strip" aria-label="Photos this session">${ids.map(id => { const l = S.local[id] || {}; const p = S.photos.find(x => x.id === id); const st = S.inflight.has(id) ? 'reading' : p ? ({queued: 'waiting', done: 'done', empty: 'empty', failed: 'failed'}[p.status] || l.state) : l.state; const src = l.preview || (p && imgUrl(p.sourceId)); return html`<div class=${'ph ' + (st || '')} title=${l.err || (p && p.error) || ''}>${src ? html`<img src=${src} alt=""/>` : null}<b>${st === 'done' && p ? arr(p.itemIds).length + ' added' : lab[st] || '…'}</b></div>`; })}</div>`;
}
function QueueStatus() {
  const queued = S.photos.filter(p => p.status === 'queued');
  const sessionSet = new Set(S.session);
  const doneSession = S.photos.filter(p => sessionSet.has(p.id) && (p.status === 'done' || p.status === 'empty')).length;
  const prep = S.session.filter(id => ['preparing', 'uploading'].includes((S.local[id] || {}).state)).length;
  const reading = S.inflight.size, waiting = Math.max(0, queued.length - reading);
  const total = doneSession + queued.length + prep;
  const out = [];
  if (!S.armed && queued.length && !S.inflight.size) out.push(html`<div class="note hi"><p><b class="num">${queued.length} photo${queued.length === 1 ? '' : 's'}</b> from last time ${queued.length === 1 ? 'is' : 'are'} still waiting to be read.</p><button class="btn sm" onClick=${resumeQueue} disabled=${!aiReady() || !S.imagesOK}>Continue sorting</button></div>`);
  if (S.paused === 'rate') out.push(html`<div class="note"><p>Paused: Claude asked us to slow down. Give it a minute, then carry on.</p><button class="btn sm" onClick=${resumeQueue}>Resume</button></div>`);
  if (S.paused === 'session') out.push(html`<div class="note"><p>Paused: you’ve been signed out of Claude. Sign in again, then resume.</p><button class="btn sm" onClick=${resumeQueue}>Resume</button></div>`);
  if (total && (reading || waiting || prep)) out.push(html`<div class="progress" role="status"><div class="row" style="justify-content:space-between"><span class="eyebrow num">Reading ${reading} · ${waiting + prep} waiting · ${doneSession} done</span><span class="eyebrow">Keep this page open</span></div><div class="bar"><i style=${'width:' + Math.round(100 * doneSession / Math.max(1, total)) + '%'}></i></div></div>`);
  return out.length ? html`<div style="display:flex;flex-direction:column;gap:10px">${out}</div>` : null;
}

  const p = S.profile; const last = S.outfits.length ? [...S.outfits].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] : null;
  const [preview, setPreview] = useState(last ? 'look' : 'none');
  const items = preview === 'look' && last ? arr(last.itemIds).map(itemById).filter(Boolean) : [];
  return html`<section class="view">
    <div class="vhead"><h1>Mock <em>me</em></h1><p class="sub">Every look is drawn on this figure. Make it feel like you, and tell the stylist what it should know about your body and taste.</p></div>
    <div class="me-grid">
      <div class="doll-box big"><${Doll} items=${items} missing=${preview === 'look' && last ? arr(last.missing) : []} profile=${p} label="Your figure"/></div>
      <div class="me-ctl">
        ${last ? html`<${Seg} label="Preview" value=${preview} onChange=${setPreview} options=${[['none', 'Bare figure'], ['look', 'Last saved look']]}/>` : null}
        <fieldset><legend>Skin tone</legend><div class="swatches">${SKINS.map(s => html`<button type="button" class="sw" style=${s === 'mannequin' ? '' : 'background:' + s} aria-pressed=${p.skin === s} aria-label=${s === 'mannequin' ? 'Mannequin' : 'Skin tone ' + s} disabled=${!canWrite()} onClick=${() => setProfile({skin: s})}>${s === 'mannequin' ? 'M' : ''}</button>`)}</div></fieldset>
        <fieldset><legend>Build</legend><div class="chips">${Object.entries(FRAMES).map(([k, v]) => html`<${Chip} on=${p.frame === k} onClick=${() => setProfile({frame: k})}>${v.label}</${Chip}>`)}</div></fieldset>
        <fieldset><legend>Hair</legend><div class="chips">${HAIRS.map(([k, l]) => html`<${Chip} on=${p.hair === k} onClick=${() => setProfile({hair: k})}>${l}</${Chip}>`)}</div>
          ${p.hair && p.hair !== 'none' ? html`<div class="swatches">${HAIR_COLORS.map(c => html`<button type="button" class="sw" style=${'background:' + c} aria-pressed=${p.hairColor === c} aria-label=${'Hair colour ' + c} onClick=${() => setProfile({hairColor: c})}></button>`)}</div>` : null}
        </fieldset>
        <fieldset><legend>Sizes</legend><div class="fgrid">
          <${TextField} id="sz-top" label="Tops" value=${p.sizeTop} placeholder="UK 10 / M" onSave=${v => setProfile({sizeTop: v.trim()})}/>
          <${TextField} id="sz-bottom" label="Bottoms" value=${p.sizeBottom} placeholder="W28 / 10" onSave=${v => setProfile({sizeBottom: v.trim()})}/>
          <${TextField} id="sz-shoe" label="Shoes" value=${p.sizeShoe} placeholder="UK 6" onSave=${v => setProfile({sizeShoe: v.trim()})}/>
        </div></fieldset>
        <${TextField} id="me-notes" area=${true} label="Notes for your stylist" value=${p.notes} placeholder="5′5″, love high waists, hate showing my arms, never wear yellow, heels only for events…" onSave=${v => setProfile({notes: v.trim().slice(0, 1200)})}/>
      </div>
    </div>
  </section>`;
}

/* ================= sheets ================= */
function WhatItIs({it}) {
  const st = S.local['id_' + it.id] || {};
  const ideas = arr(it.ideas), pairs = arr(it.pairsWith).map(itemById).filter(Boolean), sug = st.suggest;
  const differs = sug && (sug.name !== it.name || sug.category !== it.category || sug.silhouette !== it.silhouette);
  return html`<div class="what">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">What it is</span>${it.use ? html`<span class="row" style="gap:6px"><span class="pill">${USE_LABEL[it.use]}</span>${it.wearOut ? html`<span class="pill soft">${WEAROUT[it.wearOut]}</span>` : null}</span>` : null}</div>
    ${it.about ? html`<p>${it.about}</p>` : html`<p class="sub">Not sure what this is or what it’s for? Claude can look at the photo and tell you, including whether it’s nightwear, underwear or fine to wear out.</p>`}
    ${ideas.length ? html`<div class="eyebrow">Ways to wear it</div><ul class="moves">${ideas.map(x => html`<li>${x}</li>`)}</ul>` : null}
    ${pairs.length ? html`<div class="minis">${pairs.map(p => html`<button type="button" class="mini" title=${p.name} aria-label=${p.name} onClick=${() => openItem(p.id)}><${ItemImg} item=${p}/></button>`)}</div>` : null}
    ${it.care ? html`<p class="tip"><b>Care</b>${it.care}</p>` : null}
    ${differs && canWrite() ? html`<div class="ask"><span>Claude would call it <b>${sug.name}</b> (${(ONE[sug.category] || '').toLowerCase()}, ${String(sug.silhouette).replace(/-/g, ' ')})${sug.conf < 0.5 ? ', though it isn’t certain' : ''}.</span><div class="row"><button class="btn sm" onClick=${async () => { await saveItem(it.id, {name: sug.name, category: sug.category, silhouette: sug.silhouette}); setLocal('id_' + it.id, {suggest: null}); toast('Renamed to ' + sug.name + '.'); }}>Use this name</button><button class="btn sm ghost" onClick=${() => setLocal('id_' + it.id, {suggest: null})}>Keep mine</button></div></div>` : null}
    ${st.busy ? html`<${Thinking} text="Taking a closer look…"/>` : html`<div class="row"><button class="btn sm soft" disabled=${!aiReady() || !canWrite()} onClick=${() => identifyItem(it)}>${I.spark()} ${it.identifiedAt ? 'Ask again' : 'Identify this piece'}</button></div>`}
    ${st.err ? html`<p style="color:var(--bad)">${st.err}</p>` : null}
  </div>`;
}
function ItemSheet({id}) {
  const it = itemById(id);
  const [photoIdx, setPhotoIdx] = useState(0); const [discarding, setDiscarding] = useState(false); const [delConfirm, setDelConfirm] = useState(false);
  if (!it) return html`<p class="sub">This piece has been removed.</p>`;
  const photos = [it.imageId, ...arr(it.photos)].filter(Boolean);
  const shown = photos[photoIdx] ? {...it, imageId: photos[photoIdx]} : it;
  const n = wornN(it.id), lw = lastWorn(it.id), price = Number(it.price);
  const sv = patch => saveItem(it.id, patch);
  const ed = canWrite();
  const toggle = (key, v) => { const cur = arr(it[key]); sv({[key]: cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]}); };
  const c0 = arr(it.colors)[0];
  return html`
    <div class="item-top">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="pic"><${ItemImg} key=${shown.imageId || 'none'} item=${shown}/></div>
        ${photos.length > 1 ? html`<div class="thumbs">${photos.map((p, i) => html`<button aria-pressed=${i === photoIdx} aria-label=${'Photo ' + (i + 1)} onClick=${() => setPhotoIdx(i)}><img src=${imgUrl(p)} alt=""/></button>`)}</div>` : null}
        ${it.sourceId && it.imageId !== it.sourceId && ed ? html`<button class="btn sm ghost" onClick=${() => sv({imageId: it.sourceId})}>Use the full photo</button>` : null}
      </div>
      <div class="doll-box"><${Doll} items=${[it]} label=${'Your figure wearing ' + it.name}/></div>
    </div>
    <input class="name-in" id="it-name" key=${'n' + it.id} defaultValue=${it.name} disabled=${!ed} aria-label="Name" onBlur=${e => { const v = e.target.value.trim(); if (v && v !== it.name) sv({name: v}); }} onKeyDown=${e => { if (e.key === 'Enter') e.target.blur(); }}/>
    <div class="stats num"><span>Worn <b>${n}×</b></span>${lw ? html`<span>Last <b>${fmtDay(lw)}</b></span>` : null}${price > 0 ? html`<span>Per wear <b>${money(price / Math.max(1, n))}</b></span>` : null}<span>Added <b>${fmtDate(it.addedAt)}</b></span>${it.status === 'discarded' ? html`<span>Let go <b>${fmtDate(it.discardedAt)}</b></span>` : null}</div>
    <div class="row">
      ${it.status !== 'discarded' ? html`<button class="btn sm" onClick=${() => styleAround(it.id)}>${I.spark()} Style around this</button>` : null}
      ${it.status !== 'discarded' ? html`<button class="btn sm ghost" disabled=${!ed} onClick=${() => logWear([it.id], it.name)}>Wore it today</button>` : null}
      ${it.status === 'review' ? html`<button class="btn sm ghost" disabled=${!ed} onClick=${() => { confirmReview(it); toast('Added to your closet.'); }}>Confirm it’s right</button>` : null}
    </div>
    <${WhatItIs} it=${it}/>
    <div class="care">
      <div class="fgrid">
        <label class="fld" for="it-cat"><span>Category</span><select id="it-cat" value=${it.category} disabled=${!ed} onChange=${e => sv({category: e.target.value, silhouette: SIL_GROUPS[e.target.value].includes(it.silhouette) ? it.silhouette : DEFAULT_SIL[e.target.value]})}>${CATS.map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select></label>
        <label class="fld" for="it-sil"><span>Shape</span><select id="it-sil" value=${it.silhouette} disabled=${!ed} onChange=${e => sv({silhouette: e.target.value})}>${[...new Set([...(SIL_GROUPS[it.category] || []), it.silhouette].filter(Boolean))].map(s => html`<option value=${s}>${s.replace(/-/g, ' ')}</option>`)}</select></label>
        <label class="fld" for="it-pat"><span>Pattern</span><select id="it-pat" value=${it.pattern || 'solid'} disabled=${!ed} onChange=${e => sv({pattern: e.target.value})}>${PATTERNS.map(p => html`<option value=${p}>${p}</option>`)}</select></label>
        <label class="fld" for="it-use"><span>Made for</span><select id="it-use" value=${it.use || ''} disabled=${!ed} onChange=${e => sv({use: e.target.value})}><option value="">Not set</option>${USES.map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select></label>
        <label class="fld" for="it-col"><span>Main colour</span><input id="it-col" type="color" value=${colorOf(c0)} disabled=${!ed} style="padding:4px;height:42px" onChange=${e => sv({colors: [{name: (c0 && c0.name) || 'colour', hex: e.target.value}, ...arr(it.colors).slice(1)]})}/></label>
        <${TextField} id="it-mat" label="Material" value=${it.material} placeholder="cotton, satin…" onSave=${v => sv({material: v.trim().toLowerCase()})}/>
      </div>
      <${Range} id="it-form" label="Dress code" value=${it.formality} labels=${FORMALITY} onChange=${v => sv({formality: v})}/>
      <${Range} id="it-heat" label="Heat" value=${it.heat} labels=${HEAT} onChange=${v => sv({heat: v})}/>
      <fieldset><legend>Vibes</legend><div class="chips">${VIBES.map(v => html`<${Chip} on=${arr(it.vibes).includes(v)} onClick=${() => ed && toggle('vibes', v)}>${v}</${Chip}>`)}</div></fieldset>
      <fieldset><legend>Seasons</legend><div class="chips">${SEASONS.map(v => html`<${Chip} on=${arr(it.seasons).includes(v)} onClick=${() => ed && toggle('seasons', v)}>${v[0].toUpperCase() + v.slice(1)}</${Chip}>`)}</div></fieldset>
    </div>
    <div class="fgrid">
      <${TextField} id="it-brand" label="Brand" value=${it.brand} onSave=${v => sv({brand: v.trim()})}/>
      <${TextField} id="it-store" label="Where from" value=${it.store} placeholder="Shop, gift, vintage…" onSave=${v => sv({store: v.trim()})}/>
      <${TextField} id="it-price" label="Price paid" type="number" value=${it.price} onSave=${v => sv({price: v === '' ? null : num(v, null)})}/>
      <${TextField} id="it-acq" label="Bought" type="month" value=${it.acquired} onSave=${v => sv({acquired: v})}/>
    </div>
    <${TextField} id="it-notes" area=${true} label="Notes" value=${it.notes} placeholder="Fit, care, what it goes with…" onSave=${v => sv({notes: v})}/>
    ${it.details ? html`<p class="sub"><span class="eyebrow">Claude noted</span> ${it.details}</p>` : null}
    ${ed ? html`<div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px">
      ${it.status === 'discarded' ? html`<div class="row"><button class="btn soft" onClick=${() => sv({status: 'active', discardedAt: null, discardReason: ''})}>Bring it back to the rail</button></div>` :
        discarding ? html`<div class="confirm" style="border-color:var(--line)"><p>Why are you letting it go?</p><div class="chips">${DISCARD_REASONS.map(r => html`<button class="chip" onClick=${async () => { await sv({status: 'discarded', discardedAt: Date.now(), discardReason: r}); setDiscarding(false); toast('Moved to “Let go”.'); }}>${r}</button>`)}</div><div class="row"><button class="btn sm ghost" onClick=${() => setDiscarding(false)}>Cancel</button></div></div>` :
        html`<div class="row"><button class="btn soft" onClick=${() => setDiscarding(true)}>Let it go</button></div>`}
      ${delConfirm ? html`<div class="confirm"><p>Delete <b>${it.name}</b> for good? It disappears from looks and history. To keep a record, use “Let it go” instead.</p><div class="row"><button class="btn sm warn" onClick=${async () => { if (await deleteItemForGood(it)) { closeSheet(); toast('Deleted.'); } }}>Delete for good</button><button class="btn sm ghost" onClick=${() => setDelConfirm(false)}>Keep it</button></div></div>` : html`<div class="row"><button class="btn sm ghost" style="color:var(--bad);border-color:transparent;padding-left:0" onClick=${() => setDelConfirm(true)}>Delete for good</button></div>`}
    </div>` : null}`;
}
function LookSheet({look}) {
  const saved = look.savedId && S.outfits.find(o => o.id === look.savedId);
  const o = saved ? {...saved, savedId: saved.id} : look;
  const items = arr(o.itemIds).map(itemById).filter(Boolean);
  const [del, setDel] = useState(false);
  return html`
    <div class="vhead"><span class="eyebrow">${o.brief ? 'For “' + o.brief + '”' : 'Look'}</span><h2 class="look-name" style="font-size:30px">${o.name}</h2></div>
    <div class="item-top" style="grid-template-columns:0.8fr 1.2fr"><div class="doll-box big"><${Doll} items=${items} missing=${arr(o.missing)}/></div><${FlatLay} items=${items} missing=${arr(o.missing)}/></div>
    ${o.why ? html`<p>${o.why}</p>` : null}
    ${o.tip ? html`<p class="tip"><b>Styling</b>${o.tip}</p>` : null}
    <div class="row">
      ${saved ? html`<button class="btn sm ghost" aria-pressed=${!!saved.loved} disabled=${!canWrite()} onClick=${() => w('outfits/' + saved.id, 'update', {loved: !saved.loved})}>${I.heart(saved.loved)} ${saved.loved ? 'Loved' : 'Love it'}</button>` : html`<button class="btn sm" disabled=${!canWrite()} onClick=${() => saveLook(look)}>Save look</button>`}
      <button class="btn sm ghost" disabled=${!canWrite()} onClick=${() => logWear(o.itemIds, o.name, saved && saved.id)}>Wore it today</button>
    </div>
    ${saved && canWrite() ? del ? html`<div class="confirm"><p>Remove this look from your lookbook? The pieces stay in your closet.</p><div class="row"><button class="btn sm warn" onClick=${async () => { if (await w('outfits/' + saved.id, 'delete')) { closeSheet(); toast('Look removed.'); } }}>Remove look</button><button class="btn sm ghost" onClick=${() => setDel(false)}>Keep</button></div></div>` : html`<div class="row"><button class="btn sm ghost" style="color:var(--bad);border-color:transparent;padding-left:0" onClick=${() => setDel(true)}>Remove from lookbook</button></div>` : null}`;
}
function Sheet() {
  const sh = S.sheet;
  const ref = useRef(null);
  useEffect(() => { const el = ref.current; if (el) { el.scrollTop = 0; const b = el.querySelector('.x'); if (b) b.focus({preventScroll: true}); } }, [sh && (sh.id || (sh.look && (sh.look.key || sh.look.id)))]);
  return html`<div class="scrim" onClick=${e => { if (e.target === e.currentTarget) closeSheet(); }}>
    <div class="sheet" ref=${ref} role="dialog" aria-modal="true" aria-label=${sh.type === 'item' ? 'Piece details' : 'Look details'}>
      <div class="sheet-bar"><span class="grab" aria-hidden="true"></span><span class="eyebrow">${sh.type === 'item' ? 'Piece' : 'Look'}</span><button class="x" aria-label="Close" onClick=${closeSheet}>${I.close()}</button></div>
      ${sh.type === 'item' ? html`<${ItemSheet} key=${sh.id} id=${sh.id}/>` : html`<${LookSheet} look=${sh.look}/>`}
    </div>
  </div>`;
}

/* ================= app ================= */
function Boundary({children}) {
  const [err, reset] = window.htmPreact.useErrorBoundary ? window.htmPreact.useErrorBoundary() : [null, () => {}];
  if (err) return html`<div class="view"><div class="note bad"><p>This section hit a snag. Your data is safe.</p><button class="btn sm" onClick=${reset}>Try again</button></div></div>`;
  return children;
}
function App() {
  useStore();
  useEffect(() => { const k = e => { if (e.key === 'Escape' && S.sheet) closeSheet(); }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  useEffect(() => { document.body.style.overflow = S.sheet ? 'hidden' : ''; }, [!!S.sheet]);
  const r = S.route;
  const V = {closet: Closet, add: Add, style: Style, looks: Looks, insights: Insights, me: Me}[r] || Closet;
  return html`
    <header class="top"><div class="top-in"><a class="mark" href="#closet">Fitting <em>Room</em></a><${QueuePill}/><a class="me-btn" href="#me" aria-label="Mock me: your figure and stylist notes">${I.head()}</a></div></header>
    <main class="shell"><${Notices}/><${Boundary} key=${r}><${V}/></${Boundary}></main>
    <${Tabs}/>
    ${S.sheet ? html`<${Sheet}/>` : null}
    ${S.toast ? html`<div class="toast" role="status"><span>${S.toast.msg}</span></div>` : null}`;
}
const root = document.getElementById('app');
root.textContent = '';
render(html`<${App}/>`, root);
init();
})();
</script>
